<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MahMahMia - Mahjong & Rummy Score Tracker</title>
  <meta name="description" content="Free score tracker for Mahjong and Rummy. Track points during the game, settle up at the end. No signup needed.">
  <link rel="canonical" href="https://mahmahmia.com/">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#c4873b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MahMahMia">

  <!-- Open Graph (WhatsApp, Facebook, WeChat) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mahmahmia.com/">
  <meta property="og:title" content="MahMahMia - Mahjong & Rummy Score Tracker">
  <meta property="og:description" content="Track points during the game, settle up at the end. Free, no signup needed.">
  <meta property="og:image" content="https://mahmahmia.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="MahMahMia">
  <meta property="og:locale" content="en_MY">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MahMahMia - Mahjong & Rummy Score Tracker">
  <meta name="twitter:description" content="Track points during the game, settle up at the end. Free, no signup needed.">
  <meta name="twitter:image" content="https://mahmahmia.com/og-image.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f0e8;
      --ink: #3d2e1e;
      --muted: #8a7560;
      --faint: #c4a882;
      --panel: #fff;
      --panel-2: #fff8ee;
      --border: #ddd;
      --border-soft: #eee;
      --border-warm: #e8d5b8;
      --border-key: #e0d5c5;
      --row-border: #f0ebe3;
      --primary: #c4873b;
      --primary-ink: #8b5e3c;
      --success: #2d7d46;
      --danger: #c44b3f;
      --placeholder: #bbb;
      --key-active: #f3ece1;
      --sel-loser-bg: #fde8e8;
      --sel-winner-bg: #e8f5e9;
      --quick-active: #faf0e0;
      --share-active: #f0e6d9;
      --shadow: rgba(0,0,0,0.06);
    }
    /* Dark palette. Applied automatically when the OS prefers dark AND the
       user hasn't picked a theme; or forced when data-theme="dark".
       data-theme="light" keeps the light palette (dark mode off). */
    :root { color-scheme: light dark; }
    :root[data-theme="dark"] { color-scheme: dark; }
    :root[data-theme="light"] { color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #1a1714; --ink: #ece4d8; --muted: #a8957f; --faint: #6b5a45;
        --panel: #262019; --panel-2: #2e2519;
        --border: #3a3128; --border-soft: #332b22; --border-warm: #4a3c28;
        --border-key: #3a3128; --row-border: #332b22;
        --primary: #d99a4e; --primary-ink: #b3793f; --success: #4caf6e; --danger: #e0685c;
        --placeholder: #6b5a45; --key-active: #322a20;
        --sel-loser-bg: #3a2422; --sel-winner-bg: #1f3325;
        --quick-active: #322a1c; --share-active: #34291b; --shadow: rgba(0,0,0,0.4);
      }
    }
    :root[data-theme="dark"] {
      --bg: #1a1714; --ink: #ece4d8; --muted: #a8957f; --faint: #6b5a45;
      --panel: #262019; --panel-2: #2e2519;
      --border: #3a3128; --border-soft: #332b22; --border-warm: #4a3c28;
      --border-key: #3a3128; --row-border: #332b22;
      --primary: #d99a4e; --primary-ink: #b3793f; --success: #4caf6e; --danger: #e0685c;
      --placeholder: #6b5a45; --key-active: #322a20;
      --sel-loser-bg: #3a2422; --sel-winner-bg: #1f3325;
      --quick-active: #322a1c; --share-active: #34291b; --shadow: rgba(0,0,0,0.4);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      padding: 16px;
      font-size: 16px;
    }
    h1 { text-align: center; font-size: 24px; margin-bottom: 4px; color: var(--ink); }
    .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    section { display: none; max-width: 420px; margin: 0 auto; }
    section.active { display: block; }
    #theme-toggle {
      position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 12px;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--panel); color: var(--ink);
      font-size: 18px; line-height: 1; cursor: pointer; z-index: 200;
      box-shadow: 0 1px 3px var(--shadow); -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }
    #theme-toggle:active { transform: scale(0.92); }
    .btn {
      display: block; width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px;
      min-height: 48px;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: none; color: var(--muted); text-decoration: underline; border: none; font-size: 14px; cursor: pointer; padding: 8px; }
    input, select {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel); color: var(--ink); font-size: 16px; margin-bottom: 8px;
      min-height: 48px;
    }
    input::placeholder { color: var(--placeholder); }
    input:focus { border-color: var(--primary); outline: none; }
    select { appearance: none; }
    .label { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 6px; }
    .panel { background: var(--panel); border-radius: 10px; padding: 12px; margin-bottom: 16px; box-shadow: 0 1px 3px var(--shadow); }
    .score-pos { color: var(--success); }
    .score-neg { color: var(--danger); }
    .score-zero { color: var(--muted); }
    .btn-toggle {
      flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel); color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer;
      transition: transform 0.1s, opacity 0.1s, background 0.15s, color 0.15s;
    }
    .btn-toggle.active { background: var(--primary-ink); color: #fff; border-color: var(--primary-ink); }
    .player-buttons { display: flex; gap: 6px; }
    .player-btn {
      flex: 1; padding: 10px 4px; border: 2px solid var(--border); border-radius: 10px;
      background: var(--panel); color: var(--ink); font-size: 14px; font-weight: 600;
      cursor: pointer; min-height: 44px; text-align: center;
      transition: transform 0.1s, background 0.15s, border-color 0.15s, color 0.15s;
    }
    .player-btn:active { transform: scale(0.95); }
    .player-btn.selected-loser { background: var(--sel-loser-bg); border-color: var(--danger); color: var(--danger); }
    .player-btn.selected-winner { background: var(--sel-winner-bg); border-color: var(--success); color: var(--success); }
    .player-btn.disabled { opacity: 0.25; pointer-events: none; }
    .quick-amounts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .quick-amt {
      flex: 1; padding: 8px 4px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel); color: var(--primary); font-size: 14px; font-weight: 700;
      cursor: pointer; text-align: center; min-height: 38px;
      transition: transform 0.1s, background 0.15s;
    }
    .quick-amt:active { transform: scale(0.95); background: var(--quick-active); }
    .points-display {
      font-size: 22px; font-weight: 700; text-align: center; letter-spacing: 1px;
      caret-color: var(--primary);
    }
    .keypad {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px;
    }
    .keypad-actions {
      display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 8px;
    }
    .kp-key {
      padding: 14px 0; border: 1px solid var(--border-key); border-radius: 10px;
      background: var(--panel); color: var(--ink); font-size: 20px; font-weight: 600;
      cursor: pointer; min-height: 52px; user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s, background 0.12s;
    }
    .kp-key:active { transform: scale(0.95); background: var(--key-active); }
    .kp-back { color: var(--muted); }
    .kp-clear { color: var(--danger); }
    .kp-add { background: var(--success); color: #fff; border-color: var(--success); }
    .kp-add:active { filter: brightness(0.92); }
    .snackbar {
      position: fixed; bottom: -80px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 420px;
      background: var(--success); color: #fff; padding: 12px 16px; border-radius: 12px;
      font-size: 14px; font-weight: 600; text-align: center; line-height: 1.4;
      z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transition: bottom 0.3s ease;
    }
    .snackbar.show { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
    .snackbar .banner-detail { font-size: 12px; opacity: 0.8; margin-top: 2px; }
    .update-bar {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: calc(100% - 32px); max-width: 420px;
      display: none; align-items: center; gap: 12px;
      background: var(--ink); color: var(--bg);
      padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
      z-index: 150; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .update-bar.show { display: flex; }
    .update-bar button {
      margin-left: auto; background: var(--primary); color: #fff; border: none;
      border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 700;
      cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
    }
    .update-bar button:active { transform: scale(0.96); }
    @keyframes pulse-panel {
      0% { box-shadow: 0 0 0 2px var(--primary); }
      100% { box-shadow: 0 1px 3px var(--shadow); }
    }
    .standings-flash { animation: pulse-panel 0.8s ease-out; }
    .log-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; cursor: pointer; user-select: none;
    }
    .log-chevron { color: var(--muted); font-size: 14px; transition: transform 0.2s; }
    .log-chevron.open { transform: rotate(90deg); }
    .log-collapsed { display: none; }
    .log-expanded { display: block; }
    .round-entry {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px;
    }
    .round-entry:last-child { border-bottom: none; }
    .delete-btn {
      background: none; border: none; color: var(--danger); cursor: pointer;
      font-size: 18px; padding: 4px 8px; min-height: 44px; min-width: 44px;
    }
    .btn:active { transform: scale(0.97); opacity: 0.85; }
    .btn-toggle:active { transform: scale(0.97); opacity: 0.85; }
    .btn-ghost:active { opacity: 0.5; }
    .delete-btn:active { opacity: 0.5; }
    .player-title { font-size: 12px; margin-top: 2px; opacity: 0.65; }
    .standings-row { border-bottom: 1px solid var(--row-border); }
    .standings-row:last-child { border-bottom: none; }
    .standings-panel { border-top: 3px solid var(--primary); }
    @keyframes flash-in {
      from { background: rgba(196, 135, 59, 0.15); }
      to { background: transparent; }
    }
    .round-entry.flash { animation: flash-in 0.6s ease-out; }
    /* Big-win celebration: a short coin/confetti shower. */
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
    .confetti-piece {
      position: absolute; top: 0; will-change: transform, opacity;
      animation: confetti-fall var(--dur, 2s) cubic-bezier(0.3, 0.4, 0.6, 1) forwards;
    }
    @keyframes confetti-fall {
      0%   { transform: translate(0, -12vh) rotate(0deg); opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(var(--dx, 0), 112vh) rotate(var(--rot, 360deg)); opacity: 0; }
    }
    .standings-bigwin { animation: bigwin-pop 0.7s ease-out; }
    @keyframes bigwin-pop {
      0%   { transform: scale(1); box-shadow: 0 0 0 0 var(--primary); }
      35%  { transform: scale(1.04); box-shadow: 0 0 0 3px var(--primary); }
      100% { transform: scale(1); box-shadow: 0 1px 3px var(--shadow); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    /* Score rows + settlement use classes so sizes can scale responsively. */
    .st-name { font-weight: 600; font-size: 16px; }
    .st-score { font-weight: 700; font-size: 18px; }
    .settle-title { font-size: 20px; font-weight: bold; color: var(--primary); }
    .settle-flavor { color: var(--primary); font-size: 14px; margin-top: 6px; }
    .transfer-row { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
    .transfer-name { font-weight: 600; font-size: 16px; }
    .transfer-arrow { color: var(--muted); }
    .transfer-amt { margin-left: auto; font-weight: 800; font-size: 18px; color: var(--ink); }
    /* Tablets / portrait iPad: roomier single column, bigger everything */
    @media (min-width: 700px) {
      section { max-width: 600px; }
      h1 { font-size: 30px; }
      .subtitle { font-size: 16px; }
      .label { font-size: 13px; }
      .btn { font-size: 17px; }
      .panel { padding: 16px; }
      .player-btn { font-size: 16px; min-height: 52px; }
      .quick-amt { font-size: 16px; min-height: 44px; }
      .kp-key { min-height: 60px; font-size: 22px; }
      .points-display { font-size: 26px; }
      .st-name { font-size: 18px; }
      .st-score { font-size: 22px; }
      .player-title { font-size: 14px; }
      .settle-title { font-size: 26px; }
      .settle-flavor { font-size: 16px; }
      .transfer-name { font-size: 18px; }
      .transfer-amt { font-size: 22px; }
    }
    /* Wide / landscape iPad & desktop: two-column scoring so the live
       scoreboard and the entry pad are on screen at the same time. */
    @media (min-width: 920px) {
      #scoring { max-width: 900px; }
      .scoring-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
        grid-template-areas: "standings entry" "log entry";
        align-items: start;
      }
      .sg-standings { grid-area: standings; }
      .sg-entry { grid-area: entry; margin-bottom: 0; }
      .sg-log { grid-area: log; }
      .st-name { font-size: 20px; }
      .st-score { font-size: 26px; }
    }
  </style>
  <script>
    // Apply a saved theme before first paint so there's no light/dark flash.
    (function () {
      try {
        var t = localStorage.getItem('mahmahmia-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Light / dark theme">🌙</button>
  <h1>🀄 MahMahMia</h1>
  <p class="subtitle">Score Tracker</p>

  <div id="success-banner" class="snackbar"></div>

  <div id="update-banner" class="update-bar" role="alert">
    <span>🔄 New version available</span>
    <button onclick="applyUpdate()">Refresh</button>
  </div>

  <section id="setup" class="active">
    <div class="label">Game Type</div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="btn btn-toggle active" onclick="setGameType('mahjong')" id="btn-mahjong">Mahjong (3)</button>
      <button class="btn btn-toggle" onclick="setGameType('rummy')" id="btn-rummy">Rummy (4)</button>
    </div>
    <div id="name-inputs"></div>
    <div id="setup-error" style="color:var(--danger);font-size:14px;min-height:20px;margin-top:4px;"></div>
    <div id="resume-banner" style="display:none;background:var(--panel-2);border:1.5px solid var(--border-warm);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;" onclick="resumeGame()">
      <div style="font-weight:700;color:var(--ink);">继续游戏 Resume</div>
      <div id="resume-detail" style="font-size:13px;color:var(--muted);margin-top:4px;"></div>
    </div>
    <button class="btn btn-success" onclick="startGame()">Start Game →</button>
  </section>

  <section id="scoring">
    <button class="btn-ghost" onclick="backToSetup()">← Back to Setup</button>

    <div class="scoring-grid">
    <div class="sg-standings">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="label" style="margin-bottom:0;">Standings</div>
      <button id="share-btn" onclick="shareStandings()" aria-label="Share standings" style="display:none;background:var(--panel-2);border:1.5px solid var(--border-warm);border-radius:8px;font-size:14px;cursor:pointer;padding:6px 12px;color:var(--muted);transition:transform 0.1s,background 0.1s;-webkit-tap-highlight-color:transparent;" ontouchstart="this.style.transform='scale(0.93)';this.style.background='var(--share-active)'" ontouchend="this.style.transform='';this.style.background='var(--panel-2)'">↗ Share</button>
    </div>
    <div class="panel standings-panel" id="standings"></div>
    </div>

    <div class="panel sg-entry">
      <div style="margin-bottom:10px;">
        <div class="label">Who pays?</div>
        <div id="loser-buttons" class="player-buttons"></div>
      </div>
      <div style="margin-bottom:10px;">
        <div class="label">Who gets?</div>
        <div id="winner-buttons" class="player-buttons"></div>
      </div>
      <div id="quick-amounts" class="quick-amounts"></div>
      <div class="label">Points</div>
      <input type="text" id="points" class="points-display" inputmode="none" placeholder="0" style="margin-bottom:0;" onkeydown="if(event.key==='Enter')addRound()">
      <div class="keypad" id="keypad">
        <button type="button" class="kp-key" onclick="kp('7')">7</button>
        <button type="button" class="kp-key" onclick="kp('8')">8</button>
        <button type="button" class="kp-key" onclick="kp('9')">9</button>
        <button type="button" class="kp-key" onclick="kp('4')">4</button>
        <button type="button" class="kp-key" onclick="kp('5')">5</button>
        <button type="button" class="kp-key" onclick="kp('6')">6</button>
        <button type="button" class="kp-key" onclick="kp('1')">1</button>
        <button type="button" class="kp-key" onclick="kp('2')">2</button>
        <button type="button" class="kp-key" onclick="kp('3')">3</button>
        <button type="button" class="kp-key" onclick="kp('.')">.</button>
        <button type="button" class="kp-key" onclick="kp('0')">0</button>
        <button type="button" class="kp-key kp-back" onclick="kp('back')">⌫</button>
      </div>
      <div class="keypad-actions">
        <button type="button" class="kp-key kp-clear" onclick="kp('clear')">C</button>
        <button type="button" class="kp-key kp-add" onclick="addRound()">Add</button>
      </div>
      <div id="scoring-error" style="color:var(--danger);font-size:14px;min-height:20px;margin-top:4px;"></div>
    </div>

    <div class="sg-log">
    <div class="log-header" onclick="toggleLog()">
      <span class="label" style="margin-bottom:0;" id="log-label">Log (0)</span>
      <span class="log-chevron" id="log-chevron">▸</span>
    </div>
    <div class="panel log-collapsed" id="round-log"></div>
    </div>
    </div>

    <button class="btn-ghost" onclick="endGame()" style="display:block;width:100%;text-align:center;margin-top:16px;color:var(--danger);">End Game — Settle Up</button>
  </section>

  <section id="settlement">
    <div style="text-align:center;margin-bottom:16px;">
      <div class="settle-title">Game Over!</div>
      <div id="settlement-flavor" class="settle-flavor"></div>
    </div>

    <div class="label">Final Scores</div>
    <div class="panel standings-panel" id="final-scores"></div>

    <div class="label">Who Pays Who</div>
    <div class="panel" id="transfers"></div>

    <button class="btn btn-primary" onclick="backToScoring()">← Back to Scoring</button>
    <button class="btn btn-danger" onclick="newGame()">New Game</button>
  </section>

  <div style="text-align:center;padding:24px 0 8px;font-size:11px;color:var(--faint);">
    Built for game nights · © 2026 <a href="https://nexvancetech.com" target="_blank" rel="noopener" style="color:var(--faint);text-decoration:none;">NexvanceTech</a>
  </div>

  <script>
    // --- Screen switching ---
    function showScreen(id) {
      document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // --- Number formatting ---
    function fmt(n) {
      return Number.isInteger(n) ? String(n) : n.toFixed(2);
    }

    // --- In-app numeric keypad (avoids the native keyboard pushing the screen) ---
    function kp(key) {
      const input = document.getElementById('points');
      keyFeedback();
      if (key === 'back') {
        input.value = input.value.slice(0, -1);
      } else if (key === 'clear') {
        input.value = '';
      } else if (key === '.') {
        // Only one decimal point allowed, and lead a bare "." with a zero
        if (input.value.includes('.')) return;
        if (input.value === '') input.value = '0';
        input.value += '.';
      } else {
        input.value += key;
      }
      document.getElementById('scoring-error').textContent = '';
    }

    function evalExpr(str) {
      // Safely evaluate simple +/- expressions like "10+5-3"
      const cleaned = str.replace(/[^0-9.+\-]/g, '');
      if (!cleaned || /^[+\-]/.test(cleaned)) return NaN;
      const parts = cleaned.match(/[+\-]?[0-9.]+/g);
      if (!parts) return NaN;
      let total = 0;
      for (const p of parts) {
        const n = parseFloat(p);
        if (isNaN(n)) return NaN;
        total += n;
      }
      return Math.round(total * 10) / 10;
    }

    function playTone(freq, duration, type, delay) {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + duration);
    }

    function getTitle(score, isTop, isBottom, maxAbs) {
      if (score === 0) return { text: '打酱油', emoji: '😐' };
      const ratio = maxAbs > 0 ? Math.abs(score) / maxAbs : 0;
      if (score > 0) {
        if (isTop) return ratio >= 0.9 ? { text: '碾压全场', emoji: '👑' } : { text: '大老板', emoji: '👑' };
        if (ratio >= 0.6) return { text: '赢麻了', emoji: '🤑' };
        if (ratio >= 0.3) return { text: '大赚', emoji: '💰' };
        return { text: '小赚', emoji: '😏' };
      }
      if (isBottom) return ratio >= 0.9 ? { text: '倾家荡产', emoji: '💸' } : { text: '破产王', emoji: '💸' };
      if (ratio >= 0.6) return { text: '大出血', emoji: '🩸' };
      if (ratio >= 0.3) return { text: '惨了', emoji: '😭' };
      return { text: '小输', emoji: '😬' };
    }

    function calculateSettlement(netScores) {
      // Invariant: net scores must sum to zero
      const sum = Object.values(netScores).reduce((a, b) => a + b, 0);
      if (Math.abs(sum) > 0.01) throw new Error(`Net scores do not sum to zero (sum=${sum})`);
      const debtors = [];
      const creditors = [];
      for (const [name, amount] of Object.entries(netScores)) {
        if (amount < 0) debtors.push({ name, amount: Math.abs(amount) });
        else if (amount > 0) creditors.push({ name, amount });
      }
      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);
      const transfers = [];
      let d = 0, c = 0;
      while (d < debtors.length && c < creditors.length) {
        const transfer = Math.min(debtors[d].amount, creditors[c].amount);
        transfers.push({ from: debtors[d].name, to: creditors[c].name, amount: transfer });
        debtors[d].amount -= transfer;
        creditors[c].amount -= transfer;
        if (debtors[d].amount === 0) d++;
        if (creditors[c].amount === 0) c++;
      }
      return transfers;
    }

      playerCount = type === 'mahjong' ? 3 : 4;
      document.getElementById('btn-mahjong').classList.toggle('active', type === 'mahjong');
      document.getElementById('btn-rummy').classList.toggle('active', type === 'rummy');
      renderNameInputs(true);
    }

    function renderNameInputs(focusFirst) {
      const container = document.getElementById('name-inputs');
      container.innerHTML = '';
      for (let i = 0; i < playerCount; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `Player ${i + 1} name`;
        input.id = `name-${i}`;
        input.autocomplete = 'off';
        if (i === playerCount - 1) {
          input.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
        } else {
          input.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); document.getElementById(`name-${i + 1}`).focus(); }
          });
        }
        container.appendChild(input);
      }
      // Only steal focus (and pop the keyboard) on a deliberate setup gesture,
      // never on initial load or when navigating back.
      if (focusFirst) document.getElementById('name-0').focus();
    }

    function startGame() {
      const names = [];
      for (let i = 0; i < playerCount; i++) {
        const name = document.getElementById(`name-${i}`).value.trim();
        names.push(name);
      }
      // Validate: non-empty
      if (names.some(n => n === '')) {
        document.getElementById('setup-error').textContent = 'All names are required.';
        return;
      }
      // Validate: no duplicates
      if (new Set(names).size !== names.length) {
        document.getElementById('setup-error').textContent = 'Names must be unique.';
        return;
      }
      // Warn if there's an existing game in progress
      if (rounds.length > 0 && !confirm('有游戏还在进行中，确定要开新游戏吗？')) return;
      document.getElementById('setup-error').textContent = '';
      players = names;
      rounds = [];
      gameStartTime = Date.now();
      featuresUsed = new Set();
      clearState();
      renderScoring();
      showScreen('scoring');
      saveState();
    }

    // --- Theme (light / dark) ---
    // Default follows the system; the toggle writes an explicit choice to
    // localStorage so dark mode can be turned on or off and it sticks.
    function currentTheme() {
      return document.documentElement.getAttribute('data-theme')
        || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    function syncThemeUI() {
      const theme = currentTheme();
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1714' : '#c4873b');
    }
    function toggleTheme() {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('mahmahmia-theme', next); } catch (e) {}
      syncThemeUI();
    }
    // Keep the icon correct if the system theme flips while on "auto".
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!document.documentElement.getAttribute('data-theme')) syncThemeUI();
    });

    // Initialize
    syncThemeUI();
    if (restoreState() && players.length > 0 && rounds.length > 0) {
      renderScoring();
      showScreen('scoring');
    } else {
      restoreState();
      renderNameInputs();
      updateResumeBanner();
    }

    // Register the service worker (offline support) and prompt to refresh
    // when a new version has been installed and is waiting to take over.
    let waitingWorker = null;
    function showUpdateBanner(worker) {
      waitingWorker = worker;
      const el = document.getElementById('update-banner');
      if (el) el.classList.add('show');
    }
    function applyUpdate() {
      const el = document.getElementById('update-banner');
      if (el) el.classList.remove('show');
      if (waitingWorker) waitingWorker.postMessage({ type: 'SKIP_WAITING' });
      else window.location.reload();
    }
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;        // reload once, after the new worker takes control
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          // An update may already be waiting from a previous visit.
          if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              // "installed" + an existing controller => this is an update (not first install).
              if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(nw);
            });
          });
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
